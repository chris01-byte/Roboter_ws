# Experiment X3: 3D-Voxelschicht statt 2D-Hindernisschicht (lokal und global),
# dazu der LiDAR als Quelle. Raeumende Strahlen loeschen nur Voxel auf ihrer
# Hoehe: niedrige VL53-Hindernisse bleiben markiert, seitliche Waende kommen
# ueber den LiDAR in die lokale Karte. Keine Abnahme, nur Messung.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        origin_z: -0.1
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.7
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak
          lidar
        lidar:
          topic: /scan_normiert
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        origin_z: -0.1
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.7
        mark_threshold: 0
        unknown_threshold: 15
        publish_voxel_map: false
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak
          lidar
        lidar:
          topic: /scan_normiert
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
