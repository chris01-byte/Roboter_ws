# Etappenfahrt (zweite Anschlussstelle für ki_erkundung, Freigabe des
# Projektinhabers vom 21.11.2026): Der Explorer wartet nach dem Missionsstart
# auf genau ein Fahrziel und fährt es ohne Nav2 an: auf der Stelle ausrichten,
# kurze gerade, vom Laser gemessene Etappen. Ohne Ziel bewegt sich nichts.
# Das Ziel sendet während des Laufs ki_erkundung/werkzeuge/fahrziel_senden.py
# (gleiche ROS_DOMAIN_ID wie der Lauf, nur dieser Rechner).
# Am Roboter wird der Schalter als Startargument gesetzt
# (app_mapping.launch.py stage_drive_only:=true); hier als Explorer-Parameter
# über dem Produktprofil. Nur Simulation, keine Abnahme.
sh_treiber:
  explorer_parameter:
    stage_drive_only: true
