# Experiment X9: LiDAR markiert Waende in der lokalen Kostenkarte (raeumt nicht,
# damit niedrige VL53-Markierungen erhalten bleiben) und VL53 raeumen erst ab
# 0,45 m (wie X8). RPP sieht damit Seitenwaende und Pfosten bei Drehungen.
# Keine Abnahme, nur Messung.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak lidar
        lidar:
          topic: /scan_normiert
          data_type: LaserScan
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
        vl53_left:
          raytrace_min_range: 0.45
        vl53_right:
          raytrace_min_range: 0.45
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        vl53_left:
          raytrace_min_range: 0.45
        vl53_right:
          raytrace_min_range: 0.45
