# Experiment X1: LiDAR (/scan_normiert) als zusätzliche Quelle der LOKALEN
# Kostenkarte. RPP prüft seine Kontur dann auch gegen seitliche Wände und
# Türpfosten, die die VL53 nie sehen. Keine Abnahme, nur Messung.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak lidar
        lidar:
          topic: /scan_normiert
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
