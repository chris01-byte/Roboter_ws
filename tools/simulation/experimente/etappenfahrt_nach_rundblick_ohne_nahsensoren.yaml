# Rundblick, dann Etappenfahrt, ohne Nahsensoren – wie am Roboter in KI-F9
# (app_mapping.launch.py initial_scan_only:=true stage_drive_only:=true
# nahsensoren:=false): Der Explorer dreht einmal abschnittsweise um 360 Grad,
# wartet dann stehend auf ein Fahrziel und fährt es ohne Nav2 in kurzen
# geraden Etappen an. Während des Wartens wählt die KI-Linie aus der
# Blickrunde eine Tür (in der Simulation gespielt) und sendet das Ziel mit
# ki_erkundung/werkzeuge/fahrziel_senden.py --zur-tuer --wahl. Keine
# VL53-Wolken, collision_monitor ohne VL53-Quellen. Nur Simulation, keine
# Abnahme.
sh_treiber:
  explorer_parameter:
    initial_scan_only: true
    stage_drive_only: true
  nahsensoren: false
