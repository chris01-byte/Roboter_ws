# D Anlauf nach 45 s ohne Weggewinn abbrechen. Ohne C: Das Ende ergibt sich
# geometrisch (keine tiefe Luecke mehr), nicht ueber ein Zeitfenster.
# Seit 16.11.2026 stehen dieselben Werte im Produktprofil (SH-9), dazu der
# Rand vor dem tiefen Unbekannten (gap_reach_m).
sh_treiber:
  explorer_parameter:
    self_healing_scan_rad: 1.5708
    self_healing_scan_spacing_m: 2.5
    self_healing_gap_depth_m: 0.25
    self_healing_gap_reach_m: 0.05
    self_healing_attempt_stall_s: 45.0
