name: HWT601 WE integration

on:
  pull_request:
    paths:
      - 'src/robot_state_estimation/**'
      - 'src/base_hardware/**'
      - 'src/robot_navigation/**'
      - 'src/robot_bringup/launch/app_mapping.launch.py'
      - 'src/amadeus_lidar_bringup/**'
      - 'src/explore/**'
      - 'src/amadeus_map_identity/**'
      - 'src/robot_map_manager/**'
      - 'src/robot_interfaces/**'
      - 'src/mission_manager/**'
      - 'src/bt_orchestrator/**'
      - 'src/vl53_near_field/**'
      - 'src/safety_monitor/**'
      - 'tools/sensorfusion/we_hwt601_process_smoke.py'
      - 'tools/simulation/ap03_nav2_closed_loop.py'
      - 'tools/simulation/ap06*'
      - 'tools/simulation/test_ap06_world.py'
      - 'tools/simulation/test_ap06_device_isolation.py'
      - 'tools/simulation/test_ap06_lifecycle.py'
      - 'tools/simulation/ap06_trace.py'
      - 'tools/simulation/test_ap06_trace.py'
      - 'tools/simulation/slam_grid_regression.cpp'
      - 'tools/simulation/goal_checker_regression/**'
      - 'tools/simulation/navfn_cell_regression/**'
      - 'patches/nav2_navfn_humble_cell_centers.patch'
      - 'tools/simulation/prepare_ap06_sources.py'
      - 'patches/slam_toolbox_humble*.patch'
      - 'tools/kartierung/build_slam_toolbox_humble_overlay.sh'
      - 'tools/analysis/frontier_comparison/**'
      - '.github/workflows/hwt601-we.yml'
  push:
    branches: ['codex/we1-hwt601-fusion']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install declared test and filter runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pytest python3-yaml \
            python3-numpy python3-scipy python3-serial python3-pip python3-dev build-essential \
            ros-humble-robot-localization ros-humble-tf2-ros ros-humble-sensor-msgs-py \
            ros-humble-nav2-msgs ros-humble-tf2-geometry-msgs
          python3 -m pip install -r src/base_hardware/requirements-modbus.txt
          python3 -m pip install -r src/explore/requirements-geometry.txt
      - name: Build interfaces and affected HWT and map packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths src/robot_interfaces src/base_hardware \
            src/robot_state_estimation src/amadeus_map_identity src/robot_map_manager \
            src/explore src/robot_navigation src/mission_manager src/vl53_near_field \
            src/safety_monitor src/amadeus_lidar_bringup
      - name: Test real source contract and launch ownership without devices
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          export PYTHONPATH="${PWD}/src/robot_state_estimation:${PWD}/src/base_hardware:${PYTHONPATH}"
          python3 -m pytest -q src/robot_state_estimation/test src/base_hardware/test \
            src/robot_navigation/test/test_hwt601_gate_integration.py \
            src/robot_navigation/test/test_vl53_costmap_sources.py
      - name: Installed map lifecycle and source contracts
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          export ROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=227
          python3 -m pytest -q src/explore/test/test_metric_map_lifecycle.py \
            src/explore/test/test_metric_frontier.py src/explore/test/test_metric_motion_geometry.py \
            src/explore/test/test_metric_frontier_candidates.py \
            src/explore/test/test_metric_body_reference_tf.py \
            src/explore/test/test_metric_egress_reference.py \
            src/explore/test/test_metric_partial_reference.py \
            src/explore/test/test_metric_measured_motion.py \
            src/explore/test/test_hwt601_recovery_integration.py \
            src/robot_navigation/test/test_hwt601_gate_pending_wheel.py \
            src/explore/test/test_metric_source_delivery.py \
            src/explore/test/test_metric_sweep_batch.py \
            src/explore/test/test_metric_native_sweep.py \
            src/explore/test/test_action_client_registration.py \
            src/explore/test/test_metric_task_view_group.py \
            src/explore/test/test_metric_route_distances.py \
            src/explore/test/test_metric_selection_pass.py \
            src/explore/test/test_metric_rpp_egress_goal.py \
            src/explore/test/test_metric_rpp_egress_turn.py \
            src/explore/test/test_metric_planning_stop_reason.py \
            src/explore/test/test_metric_alternative_pose.py \
            src/explore/test/test_metric_departure.py \
            src/explore/test/test_metric_initial_body_inventory.py \
            src/explore/test/test_metric_observation_sources.py \
            src/explore/test/test_metric_planner_abort.py \
            src/explore/test/test_metric_proposal_accounting.py \
            src/explore/test/test_metric_proposal_alternatives.py \
            src/explore/test/test_metric_retained_observation.py src/explore/test/test_metric_boundary_tangent_view.py \
            src/explore/test/test_metric_goalchecker_refuge.py \
            src/explore/test/test_metric_query_selection_budget.py \
            src/explore/test/test_metric_visibility_blocks.py \
            src/explore/test/test_metric_robot_side_observation.py \
            src/explore/test/test_metric_observation_neighbourhood.py \
            src/explore/test/test_metric_scan_before_queries.py \
            src/explore/test/test_metric_scan_join.py \
            src/explore/test/test_metric_side_before_rejection.py \
            src/explore/test/test_metric_side_work_budget.py \
            src/explore/test/test_metric_public_observation.py \
            src/explore/test/test_metric_arrival_revalidation.py \
            src/explore/test/test_metric_pending_withdrawal.py \
            src/explore/test/test_metric_public_cooldown.py \
            src/explore/test/test_metric_public_body_authority.py \
            src/explore/test/test_metric_public_alignment.py \
            src/explore/test/test_metric_stop_observation.py \
            src/explore/test/test_metric_snapshot_replan.py \
            src/explore/test/test_metric_start_observation.py \
            src/explore/test/test_metric_join_replan.py \
            tools/simulation/test_ap06_world.py \
            tools/simulation/test_ap06_device_isolation.py tools/simulation/test_ap06_lifecycle.py tools/simulation/test_ap06_trace.py \
            src/explore/test/test_metric_progress.py src/explore/test/test_metric_result_action.py \
            src/mission_manager/test/test_metric_exploration_result.py \
            src/explore/test/test_map_status_adapter.py \
            src/explore/test/test_raw_map_portal_adapter.py \
            src/amadeus_map_identity/test src/robot_map_manager/test src/vl53_near_field/test \
            src/safety_monitor/test src/amadeus_lidar_bringup/test
      - name: Real EKF prediction must not mask missing raw sources
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 tools/sensorfusion/we_hwt601_process_smoke.py --drop raw
          python3 tools/sensorfusion/we_hwt601_process_smoke.py --drop wheel

  ap03_closed_loop:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install real Nav2 plugins and simulation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-numpy python3-scipy \
            python3-yaml python3-pytest python3-serial python3-pip python3-dev build-essential \
            ros-humble-nav2-planner ros-humble-nav2-navfn-planner \
            ros-humble-nav2-controller ros-humble-nav2-regulated-pure-pursuit-controller \
            ros-humble-tf2-geometry-msgs ros-humble-sensor-msgs-py \
            libeigen3-dev libtbb-dev libboost-system-dev libboost-serialization-dev \
            libboost-filesystem-dev libboost-thread-dev
          python3 -m pip install -r src/base_hardware/requirements-modbus.txt
          python3 -m pip install -r src/explore/requirements-geometry.txt
      - name: Build pinned NavFn cell-coordinate correction and test the real plugin
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 tools/simulation/prepare_ap06_sources.py --only navigation2 \
            --cache /tmp/ap06-cache --destination /tmp/ap06-navfn-source
          colcon build --base-paths /tmp/ap06-navfn-source/navigation2/nav2_navfn_planner \
            --build-base /tmp/ap06-navfn-build --install-base /tmp/ap06-navfn-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          source /tmp/ap06-navfn-install/setup.bash
          cmake -S tools/simulation/navfn_cell_regression -B /tmp/ap06-navfn-regression
          cmake --build /tmp/ap06-navfn-regression -j2
          ctest --test-dir /tmp/ap06-navfn-regression --output-on-failure
      - name: Test pinned native SLAM raster growth without changing guard authority
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 tools/simulation/prepare_ap06_sources.py --only slam_toolbox \
            --cache /tmp/ap06-cache --destination /tmp/ap06-native
          cmake -S /tmp/ap06-native/slam_toolbox/lib/karto_sdk -B /tmp/ap06-karto
          cmake --build /tmp/ap06-karto -j2
          g++ -std=c++17 tools/simulation/slam_grid_regression.cpp \
            -I/tmp/ap06-native/slam_toolbox/lib/karto_sdk/include \
            -L/tmp/ap06-karto -lkartoSlamToolbox -lboost_serialization \
            -Wl,-rpath,/tmp/ap06-karto -o /tmp/ap06-grid-regression
          /tmp/ap06-grid-regression | tee /tmp/ap06-grid-regression.log
      - name: Native goal checker must recheck position during final rotation
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cmake -S tools/simulation/goal_checker_regression -B /tmp/ap06-goal-checker
          cmake --build /tmp/ap06-goal-checker -j2
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          params = yaml.safe_load(Path('src/robot_navigation/config/nav2_params_real.yaml').read_text())
          stateful = params['controller_server']['ros__parameters']['general_goal_checker']['stateful']
          subprocess.run(['/tmp/ap06-goal-checker/goal_checker_regression', str(stateful).lower()], check=True)
          PY
      - name: Build current product and run isolated closed synthetic world
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths src/robot_interfaces src/base_hardware \
            src/robot_state_estimation src/amadeus_map_identity src/robot_map_manager \
            src/explore src/robot_navigation src/mission_manager src/vl53_near_field \
            src/safety_monitor src/amadeus_lidar_bringup
          source install/setup.bash
          source /tmp/ap06-navfn-install/setup.bash
          export ROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=228
          python3 tools/simulation/ap03_nav2_closed_loop.py --repo "$PWD" --output /tmp/ap03-world
          export AP06_SIMULATION=1 ROS_DOMAIN_ID=180
          python3 tools/simulation/ap06_nearfield_costmap_probe.py --repo "$PWD" --output /tmp/ap06-costmap
      - name: Preserve action logs, paths and independent measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap03-closed-loop
          path: |
            /tmp/ap03-world
            /tmp/ap06-costmap
            /tmp/ap06-grid-regression.log
