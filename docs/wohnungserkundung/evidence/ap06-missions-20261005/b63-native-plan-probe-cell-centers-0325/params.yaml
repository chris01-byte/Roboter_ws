local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.31, 0.23], [0.31, -0.23], [-0.11, -0.23], [-0.11, 0.23]]'
      footprint_padding: 0.02
      global_frame: odom
      height: 6
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        oak:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: -0.04
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          topic: /oak/points
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak
        plugin: nav2_costmap_2d::ObstacleLayer
        vl53_left:
          clearing: true
          data_type: PointCloud2
          marking: false
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
          topic: /near_field/left/points_costmap
        vl53_left_mark:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          topic: /near_field/left/points
        vl53_right:
          clearing: true
          data_type: PointCloud2
          marking: false
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
          topic: /near_field/right/points_costmap
        vl53_right_mark:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          topic: /near_field/right/points
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 5.0
      width: 6
map_server:
  ros__parameters:
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.3
      use_astar: true
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
slam_toolbox:
  ros__parameters:
    angle_variance_penalty: 1.0
    base_frame: base_link
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_loss_function: None
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    check_min_dist_and_heading_precisely: true
    coarse_angle_resolution: 0.0349
    coarse_search_angle_offset: 0.349
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    debug_logging: false
    distance_variance_penalty: 0.5
    do_loop_closing: true
    fine_search_angle_offset: 0.00349
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 3.0
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    map_frame: map
    map_update_interval: 1.0
    max_laser_range: 10.0
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.01
    minimum_travel_heading: 0.15
    mode: mapping
    odom_frame: odom
    resolution: 0.03
    scan_buffer_maximum_scan_distance: 10.0
    scan_buffer_size: 10
    scan_topic: /scan_normiert
    solver_plugin: solver_plugins::CeresSolver
    stack_size_to_use: 40000000
    tf_buffer_duration: 30.0
    throttle_scans: 1
    transform_publish_period: 0.02
    transform_timeout: 0.2
    use_response_expansion: true
    use_scan_barycenter: true
    use_scan_matching: true
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.12
    - 0.0
    - 0.3
    max_decel:
    - -0.3
    - 0.0
    - -0.6
    max_velocity:
    - 0.12
    - 0.0
    - 0.25
    min_velocity:
    - 0.0
    - 0.0
    - -0.25
    odom_duration: 0.1
    odom_topic: /odom
    scale_velocities: true
    smoothing_frequency: 20.0
    velocity_timeout: 0.5
