amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    always_reset_initial_pose: true
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    first_map_only: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: /scan_normiert
    set_initial_pose: false
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.02
    use_sim_time: false
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    robot_base_frame: base_link
    rotational_acc_lim: 2.0
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors/Spin
    transform_tolerance: 0.2
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: /evidence/ap06-repo/tools/simulation/navigate_through_poses_no_recovery.xml
    default_nav_to_pose_bt_xml: /evidence/ap06-repo/src/explore/behavior_trees/navigate_to_pose_no_recovery.xml
    default_server_timeout: 2000
    global_frame: map
    odom_topic: /odom
    robot_base_frame: base_link
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: /local_costmap/published_footprint
      max_points: 1
      polygon_pub_topic: collision_mapping_approach
      simulation_time_step: 0.05
      time_before_collision: 2.0
      type: polygon
      visualize: true
    SlowZone:
      action_type: slowdown
      enabled: true
      max_points: 1
      points:
      - 0.8
      - 0.25
      - 0.8
      - -0.25
      - 0.3
      - -0.25
      - 0.3
      - 0.25
      polygon_pub_topic: collision_slow_zone
      slowdown_ratio: 0.3
      type: polygon
      visualize: true
    base_frame_id: base_link
    base_shift_correction: false
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    observation_sources:
    - vl53_left
    - vl53_right
    odom_frame_id: odom
    polygons:
    - FootprintApproach
    - SlowZone
    source_timeout: 3.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 2.0
    transform_tolerance: 0.3
    vl53_left:
      enabled: true
      max_height: 0.5
      min_height: 0.05
      topic: /near_field/left/points
      type: pointcloud
    vl53_right:
      enabled: true
      max_height: 0.5
      min_height: 0.05
      topic: /near_field/right/points
      type: pointcloud
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      desired_linear_vel: 0.1
      lookahead_dist: 0.4
      max_angular_accel: 2.0
      max_lookahead_dist: 1.0
      min_lookahead_dist: 0.4
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.04
      rotate_to_heading_angular_vel: 0.2
      rotate_to_heading_min_angle: 0.35
      transform_tolerance: 0.2
      use_collision_detection: true
      use_interpolation: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 1.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.4
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 30.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.05
      required_movement_radius: 0.1
    progress_checker_plugin: progress_checker
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint_padding: 0.0
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        oak:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: -0.04
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          topic: /oak/points
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak
        plugin: nav2_costmap_2d::ObstacleLayer
        vl53_left:
          clearing: true
          data_type: PointCloud2
          marking: false
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
          topic: /near_field/left/points_costmap
        vl53_left_mark:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          topic: /near_field/left/points
        vl53_right:
          clearing: true
          data_type: PointCloud2
          marking: false
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
          topic: /near_field/right/points_costmap
        vl53_right_mark:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          topic: /near_field/right/points
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      robot_radius: 0.325
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
