base_hardware:
  ros__parameters:
    accel_ms: 2000
    accel_register: 30
    allow_rs485: true
    base_frame_id: base_link
    baudrate: 115200
    cmd_timeout_s: 0.25
    cmd_vel_topic: /cmd_vel
    command_register: 39
    decel_ms: 400
    decel_register: 31
    direction_register: 28
    dry_run: false
    encoder_counts_per_motor_revolution: 1000.0
    encoder_expected_resolution: 4000
    encoder_expected_segment: 1000
    encoder_failure_stop_count: 5
    encoder_feedback_period_s: 0.05
    encoder_max_delta_factor: 1.5
    encoder_max_recovery_gap_s: 2.0
    encoder_position_register: 10
    encoder_resolution_register: 257
    encoder_segment_register: 17
    encoder_stale_timeout_s: 0.3
    encoder_timing_recovery_enabled: true
    encoder_word_order_register: 25
    feedback_period_s: 0.1
    gear_ratio: 10.0
    invert_left: false
    invert_right: true
    left_motor_id: 1
    max_angular_speed_radps: 0.8
    max_linear_speed_mps: 0.3
    max_motor_rpm: 700.0
    modbus_retries: 0
    modbus_timeout_s: 0.1
    modbus_write_period_s: 0.05
    odom_frame_id: odom
    odom_pose_xy_variance: 0.0025
    odom_topic: /fusion/hwt601/wheel_odom_raw
    odom_twist_angular_variance: 0.03
    odom_twist_linear_variance: 0.01
    odom_yaw_variance: 0.0076
    odometry_source: encoder_position
    publish_tf: false
    right_motor_id: 2
    rpm_register: 29
    rpm_scale: 1.0
    rs485_port: /dev/ttyUSB_BASE
    speed_register: 12
    start_speed_register: 32
    start_speed_rpm: 5
    state_topic: /base_hardware/state_json
    stop_value: 256
    update_rate_hz: 50.0
    use_speed_feedback: true
    velocity_start_value: 2
    wheel_radius_m: 0.0624
    wheel_separation_m: 0.3845
hwt601_imu:
  ros__parameters:
    acceleration_full_scale_g: 4.0
    angular_velocity_full_scale_dps: 400.0
    angular_velocity_variance: 5.0e-07
    baud: 115200
    development_contract: true
    device_address: 80
    diagnostics_topic: /shadow/hwt601/raw_diagnostics
    errors_before_reconnect: 3
    frame_id: hwt601_link
    imu_topic: /shadow/hwt601/imu/data_raw
    linear_acceleration_variance: 0.25
    poll_rate_hz: 100.0
    port: /dev/ttyUSB_HWT601
    reconnect_interval_s: 1.0
    response_timeout_s: 0.05
    saturation_margin_counts: 8
    sensor_timeout_s: 0.3
    status_topic: /shadow/hwt601/raw_status_json
