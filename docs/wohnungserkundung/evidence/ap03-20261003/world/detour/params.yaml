controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      desired_linear_vel: 0.1
      lookahead_dist: 0.4
      max_angular_accel: 2.0
      max_lookahead_dist: 1.0
      min_lookahead_dist: 0.4
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.04
      rotate_to_heading_angular_vel: 0.2
      rotate_to_heading_min_angle: 0.35
      transform_tolerance: 0.2
      use_collision_detection: true
      use_interpolation: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 1.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.4
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 30.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.05
      required_movement_radius: 0.1
    progress_checker_plugin: progress_checker
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint_padding: 0.0
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        oak:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: -0.04
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
          topic: /oak/points
        observation_sources: vl53_left vl53_right vl53_left_mark vl53_right_mark oak
        plugin: nav2_costmap_2d::ObstacleLayer
        vl53_left:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
          topic: /near_field/left/points_costmap
        vl53_left_mark:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          topic: /near_field/left/points
        vl53_right:
          clearing: true
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
          topic: /near_field/right/points_costmap
        vl53_right_mark:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 0.5
          min_obstacle_height: 0.05
          obstacle_max_range: 0.55
          topic: /near_field/right/points
      plugins:
      - static_layer
      - inflation_layer
      publish_frequency: 10.0
      resolution: 0.02
      robot_base_frame: base_link
      robot_radius: 0.28
      rolling_window: false
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: false
      track_unknown_space: true
      update_frequency: 20.0
