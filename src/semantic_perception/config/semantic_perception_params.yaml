# =====================================================================
#  semantic_perception_params.yaml  -  Open-Vocabulary (WP-5 Baustein B)
# ---------------------------------------------------------------------
#  Backend 'stub' = simulierte Erkennung (Trockentest, Standard).
#  Backend 'yoloworld' = echte Open-Vocabulary-Erkennung (ultralytics).
#    Voraussetzung:  pip install ultralytics  + RGB/Depth/CameraInfo/TF.
#    Bei fehlender Voraussetzung liefert ein reales Backend keinen Treffer;
#    simulierte Posen gibt es nur mit dem expliziten Backend "stub".
#
#  PARAMETER-INDEX:
#    model_backend ......... Zeile 30
#    service_name .......... Zeile 31
#    rgb_topic ............. Zeile 34
#    depth_topic ........... Zeile 35
#    camera_info_topic ..... Zeile 36
#    global_frame .......... Zeile 37
#    camera_frame .......... Zeile 38
#    confidence_threshold .. Zeile 39
#    model_path ............ Zeile 40
#    depth_scale ........... Zeile 41
#    class_queries ......... Zeile 44
#    model_class_prompts ... Zeile 51
#    publish_catalog ....... Zeile 52
#    catalog_topic ......... Zeile 53
#    catalog_period_s ...... Zeile 54
#    known_rooms ........... Zeile 55
#    stub_position ......... Zeile 63
#    stub_confidence ....... Zeile 64
# =====================================================================
semantic_perception:
  ros__parameters:
    # --- Backend / Service ---
    model_backend: "stub"                  # "stub" (Test) | "yoloworld" (echt) | "owlvit" (Platzhalter)
    service_name: "/world_model/get_object_pose"

    # --- Kamera / Frames ---
    # Das lokale Relay in oak.launch.py publiziert nur 2 Hz, komprimiert und
    # Best-Effort. Direkte Rohbild-Subscriptions vom KI-Server sind verboten:
    # sie drueckten RGB im A/B-Test bis unter 1 Hz und blockierten image_proc.
    compressed_input: true
    rgb_topic: "/oak/semantic/rgb/compressed"
    depth_topic: "/oak/semantic/depth/compressed"
    camera_info_topic: "/oak/semantic/camera_info"
    global_frame: "map"
    # Frame des OAK-Treibers. Die URDF nennt ihn camera_rgb_optical_frame, der
    # Treiber oak_rgb_camera_optical_frame - im Betrieb gilt der Treiber-Frame.
    camera_frame: "oak_rgb_camera_optical_frame"
    base_frame: "base_link"
    confidence_threshold: 0.35
    model_path: "yolov8s-worldv2.pt"       # YOLO-World-Gewichte (nur Backend 'yoloworld')
    model_image_size: 640                  # Standardprofil 320x180 -> YOLO-Eingang 640
    detail_model_image_size: 960           # HD-Detailprofil: real gemessen deutlich robuster
    detail_input_min_width: 1000           # ab dieser RGB-Breite Detail-Inferenz verwenden
    depth_scale: 0.001                     # Tiefen-Rohwert -> Meter (OAK: mm -> 0.001)
    max_input_age_s: 2.0                   # alte WLAN-/Kameraframes fail-closed ablehnen
    max_rgb_depth_skew_s: 0.20             # nur zeitlich passendes RGB-D projizieren
    input_pair_queue_size: 10              # Empfangsrennen RGB vor Tiefe lokal abfangen

    # --- Erkennbare Objekte (open-vocabulary Queries) ---
    class_queries:
      - Tasse
      - Flasche
      - Fernbedienung
      - Werkzeug
      - Schluessel

    # Service/App bleiben deutsch. YOLO-World/CLIP erkennt dieselben Objekte
    # mit englischen Prompts reproduzierbar besser. Die Listen sind bewusst
    # positionsgleich; eine abweichende Laenge oder Dopplung stoppt den Node.
    model_class_prompts:
      - cup
      - bottle
      - remote control
      - tool
      - key

    # --- Wahrnehmungs-Katalog (Diagnose / spaetere Objektfusion) ---
    # /semantic/catalog_json gehoert dem semantic_map_manager als einziger
    # kanonischer Quelle fuer manuell bestaetigte Raeume. Zwei Publisher auf
    # demselben Topic wuerden die Raumliste gegenseitig ueberschreiben.
    publish_catalog: true
    catalog_topic: "/semantic/perception_catalog_json"
    catalog_period_s: 5.0
    known_rooms:
      - Wohnzimmer
      - Kueche
      - Flur
      - Schlafzimmer
      - Werkstatt

    # --- Objekt-Gedaechtnis / semantische Karte (K2) ---
    scan_period_s: 2.0        # wie oft im Hintergrund erkannt + gemerkt wird [s]
    memory_ttl_s: 0.0         # Gedaechtnis-Verfall [s]; 0 = nie verfallen
    live_fallback: true       # bei Cache-Miss zusaetzlich das aktuelle Bild pruefen

    # --- Kartenbindung und App-Status ---
    localization_status_topic: "/localization/status_json"
    localization_max_age_s: 1.0
    require_localization_for_map: true
    object_map_topic: "/semantic/object_map_json"
    observation_status_topic: "/semantic/observation_status_json"
    semantic_status_period_s: 1.0
    observation_ttl_s: 5.0
    maximum_object_markers: 64

    # --- Stub-Verhalten (nur Backend 'stub') ---
    stub_position: [1.0, 0.0, 0.5]
    stub_confidence: 0.8
