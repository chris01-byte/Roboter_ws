# Bedarfsgesteuertes HD-RGB-D-Profil fuer Gegenstands- und Detailaufnahmen.
# Nicht parallel zum Standardprofil betreiben. 1920x1080 Sensorbild * 2/3
# ergibt 1280x720; die ausgerichtete Tiefe bleibt pixelgleich zum RGB-Bild.
/oak:
  ros__parameters:
    camera:
      i_nn_type: none
      i_enable_imu: true
    # Identisch zum real abgenommenen BMI270-Vertrag der Standard-/SLAM-
    # Profile. Auch im kurzzeitigen HD-Modus keine impliziten Treiberwerte.
    imu:
      i_message_type: IMU
      i_sync_method: COPY
      i_enable_acc: true
      i_acc_mode: ACCELEROMETER_RAW
      i_acc_freq: 100
      i_enable_gyro: true
      i_gyro_mode: GYROSCOPE_RAW
      i_gyro_freq: 100
      i_enable_mag: false
      i_enable_rotation: false
    left:
      i_fps: 5.0
    right:
      i_fps: 5.0
    stereo:
      i_align_depth: true
      i_board_socket_id: 2
      i_subpixel: true
      i_depth_preset: HIGH_ACCURACY
      i_enable_speckle_filter: true
      i_width: 1280
      i_height: 720
    rgb:
      i_fps: 5.0
      i_set_isp_scale: true
      i_isp_num: 2
      i_isp_den: 3
      i_width: 1280
      i_height: 720
