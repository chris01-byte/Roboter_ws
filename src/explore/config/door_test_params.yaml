# Begrenztes Profil fuer genau den beaufsichtigten Tuer-Abnahmetest.
# Nur zusammen mit active_drive:=true, enable_auto_explore:=true und einer
# frischen persoenlichen Fahrfreigabe verwenden. Die normale Wohnungserkundung
# laedt weiterhin explore_params.yaml ohne diese Ueberschreibungen.
explore_node:
  ros__parameters:
    # Rundblick und Vorausrichtung bleiben aktiv. Danach ist hoechstens ein
    # erfolgreiches Frontier-Ziel erlaubt; eine weitere Frontier fuehrt zum
    # fail-closed Abbruch statt zur naechsten Fahrt.
    max_frontier_goals: 1
    max_failed_goals: 1
    coverage_enabled: false
    overall_timeout_s: 300.0
    # Nach dem Rundblick steht der Roboter wieder zur Tuer. Anders als die
    # reine Gewichtung schliesst der 20-Grad-Halbkegel seitliche Ziele hart
    # aus. Ohne sichere Frontier vor der Front endet der Test ohne Translation.
    heading_scale: 3.0
    frontier_forward_cone_half_angle_rad: 0.3490658503988659
