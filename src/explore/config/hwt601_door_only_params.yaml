# Einmalige, beaufsichtigte HWT601-Abnahme durch genau eine offene Tuer.
# Der Roboter scannt selbst, waehlt ausschliesslich ein Ziel im vorderen
# Tuersektor, richtet sich darauf aus und navigiert mit Nav2 hindurch. Trennt
# die Costmap die schmale Tuer kuenstlich, darf genau eine LiDAR-gepruefte
# Portalbruecke uebernehmen. Keine manuell vorgegebene Geradeausfahrt.
explore_node:
  ros__parameters:
    # Der reale segmentierte HWT-Rundblick benoetigt rund 146 s. Danach bleiben
    # ein 120-s-Nav2-Ziel samt begrenzter Vorausrichtung und Stoppreserve.
    overall_timeout_s: 480.0
    goal_timeout_s: 120.0
    max_frontier_goals: 1
    max_failed_goals: 1
    initial_scan_enabled: true
    scan_only: false
    initial_scan_angular_speed_radps: 0.08
    initial_scan_segment_angle_rad: 0.7853981633974483
    initial_scan_segment_pause_s: 1.0
    initial_scan_timeout_s: 280.0
    # Im zweiten Echtlauf stoppte das Fahrtor nach 0,8 s korrekt wegen eines
    # einmaligen 10,924-s-Aussetzers des gemeinsamen VL53-Prozesses. Nur der
    # reine Rundblick wartet deshalb begrenzt auf dessen Wiederkehr; die
    # strengere Vorwaertsfahrt-Grenze bleibt unten unveraendert bei 8 s.
    scan_no_progress_timeout_s: 15.0
    coverage_enabled: false

    # Die Karte bestimmt das Ziel. Nur ein Ziel innerhalb +/-20 Grad zur nach
    # dem Rundblick wiederhergestellten Startfront darf Nav2 erhalten.
    heading_scale: 3.0
    frontier_forward_cone_half_angle_rad: 0.3490658503988659
    frontier_forward_stage_max_distance_m: 0.0

    door_supervised_wheel_budget_mode: false
    door_lidar_motion_mode: false
    door_traverse_distance_m: 0.0
    door_encoder_wheel_budget_m: 0.0

    portal_crossing_enabled: true
    portal_priority_when_available: false
    portal_max_crossings: 1
    portal_max_staging_goals: 3
    portal_connected_max_goals: 2
    portal_stop_after_crossing: true
    stop_after_first_navigation_goal: false
    portal_max_traverse_distance_m: 1.00
    portal_max_encoder_budget_m: 2.00
    door_linear_speed_mps: 0.04
    door_timeout_s: 90.0
    door_no_progress_timeout_s: 8.0
    door_max_angular_speed_radps: 0.04
    door_max_heading_error_rad: 0.10
    door_max_lateral_error_m: 0.04
