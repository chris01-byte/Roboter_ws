# Begrenzte erste Translationsabnahme des HWT601-Kartenpfads.
#
# Der Explorer faehrt genau 0,50 m geradeaus und beendet die Mission danach.
# Der reale Chassisweg stammt aus einem beim Start eingefrorenen LiDAR-Scan;
# Encoder sind nur Gesundheitspruefung und hartes Radbudget. Es werden weder
# Rundblick, Frontier, Portal noch Flaechenabdeckung ausgefuehrt.
explore_node:
  ros__parameters:
    overall_timeout_s: 90.0
    max_frontier_goals: 1
    max_failed_goals: 1
    initial_scan_enabled: false
    scan_only: false
    coverage_enabled: false
    portal_crossing_enabled: false

    door_supervised_wheel_budget_mode: false
    door_lidar_motion_mode: true
    door_traverse_distance_m: 0.50
    door_encoder_wheel_budget_m: 0.90
    door_linear_speed_mps: 0.05
    door_timeout_s: 60.0
    door_no_progress_timeout_s: 8.0
    door_max_angular_speed_radps: 0.05
    door_max_heading_error_rad: 0.17
    door_max_lateral_error_m: 0.06
