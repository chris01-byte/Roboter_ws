# =====================================================================
#  costmap_vl53_obstacle_layer.snippet.yaml   (WP-1b - DOKU-SCHNIPSEL)
#  ------------------------------------------------------------------
#  !!! UEBERHOLT - NICHT MEHR ABSCHREIBEN (Stand 27.07.2026) !!!
#
#  Die produktive Fassung steht in
#      robot_navigation/config/nav2_params_real.yaml
#  und ist am Roboter erprobt. Dieses Schnipsel stammt aus der Zeit VOR der
#  Hardware und enthaelt zwei Fehler, die real teuer waren:
#
#   1) Es zeigt auf /near_field/*/points. Diese Wolke ist sparsam: bei freier
#      Sicht enthaelt sie NULL Punkte. Der ObstacleLayer bekommt dann keine
#      Raeum-Strahlen und loescht nie - die Costmap fuellte sich komplett mit
#      Geister-Hindernissen. Richtig ist /near_field/*/points_costmap (je
#      Spalte ein Punkt, freie Richtungen auf Max-Reichweite).
#   2) obstacle_max_range 0.6 / raytrace 0.8 liegen ueber der tatsaechlichen
#      VL53-Reichweite (z_max 0.50) - jenseits davon kommt nie ein Punkt an.
#
#  Die Werte unten sind auf den erprobten Stand korrigiert, damit ein
#  versehentliches Uebernehmen nicht erneut in die Falle laeuft.
# =====================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      # Falls schon eine plugins-Liste existiert: "obstacle_layer" ergaenzen.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: vl53_left vl53_right
        vl53_left:
          topic: /near_field/left/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
        vl53_right:
          topic: /near_field/right/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
