<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17202a">
  <!-- iOS/Home-Bildschirm: Vollbild-App + eigenes Icon (Safari: Teilen ->
       "Zum Home-Bildschirm"). Ohne diese Zeilen zeigt iOS nur einen Screenshot. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Roboter">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Roboter Konsole</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Roboter</h1>
        <p id="missionLine">Bereit</p>
      </div>
      <div class="status-stack">
        <span id="rosState" class="pill disconnected">ROS getrennt</span>
        <span id="missionState" class="pill idle">idle</span>
        <span id="kiState" class="pill">KI unbekannt</span>
      </div>
    </header>

    <section class="connection-panel" aria-label="Verbindung">
      <label for="bridgeUrl">rosbridge</label>
      <div class="connect-row">
        <input id="bridgeUrl" type="url" inputmode="url" autocomplete="off">
        <button id="connectBtn" class="icon-btn" title="Verbinden" aria-label="Verbinden">&#x23FB;</button>
      </div>
    </section>

    <section class="status-panel" aria-label="Status">
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      <div class="status-grid">
        <div><span>Phase</span><strong id="phaseText">-</strong></div>
        <div><span>Auftrag</span><strong id="activeCommand">-</strong></div>
      </div>
    </section>

    <nav class="tabs" aria-label="Missionstyp">
      <button class="tab active" data-tab="room">Raum</button>
      <button class="tab" data-tab="pick">Greifen</button>
      <button class="tab" data-tab="carry">Bringen</button>
      <button class="tab" data-tab="explore">Erkunden</button>
    </nav>

    <section class="mission-card active" id="panel-room">
      <label for="roomSelect">Raum</label>
      <select id="roomSelect"></select>
      <button class="primary" id="goRoomBtn">Fahren</button>
    </section>

    <section class="mission-card" id="panel-pick">
      <label for="pickObjectSelect">Objekt</label>
      <select id="pickObjectSelect"></select>
      <button class="primary" id="pickBtn">Greifen</button>
    </section>

    <section class="mission-card" id="panel-carry">
      <label for="carryObjectSelect">Objekt</label>
      <select id="carryObjectSelect"></select>
      <div class="two-col">
        <div>
          <label for="carryRoomSelect">Zielraum</label>
          <select id="carryRoomSelect"></select>
        </div>
        <div>
          <label for="targetSelect">Ablage</label>
          <select id="targetSelect"></select>
        </div>
      </div>
      <button class="primary" id="carryBtn">Bringen</button>
    </section>

    <section class="mission-card" id="panel-explore">
      <p class="hint-text">Der Roboter erkundet die Wohnung selbststaendig
      (Frontier-Methode) und baut dabei sein Objektgedaechtnis auf.</p>
      <button class="primary" id="exploreBtn">Erkundung starten</button>
    </section>

    <!-- Not-Aus: publiziert /safety/estop_request an den safety_monitor (K4).
         Hinweis: Software-Stopp - der Hardware-Not-Aus bleibt Pflicht. -->
    <section class="estop-row" aria-label="Not-Aus">
      <button id="estopBtn" class="estop">NOT-AUS</button>
    </section>

    <section class="control-row" aria-label="Schnellaktionen">
      <button id="cancelBtn" class="danger">Mission stoppen</button>
      <button id="refreshBtn" class="secondary">Status</button>
    </section>

    <section class="log-panel" aria-label="Log">
      <div class="panel-title">Log</div>
      <ol id="logList"></ol>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
