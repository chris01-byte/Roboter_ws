# =====================================================================
#  base_hardware_params.yaml - Basisantrieb / Differential Drive
# =====================================================================
#  Standard ist bewusst Dry-run. Fuer echten RS485-Test auf Staendern:
#    dry_run: false
#    allow_rs485: true
#  Vorher Motorregister mit dem NEMA23-RS485-Manual abgleichen!
#
#  SCHNELL FINDEN (nach Abschnittsnamen suchen, keine Zeilennummern):
#    "Topics"        cmd_vel/odom/state
#    "Geometrie"     Radradius, Spurweite  [GEMESSEN 13.07.2026]
#    "Getriebe"      gear_ratio (Motor -> Rad)
#    "Limits"        max_linear/max_angular
#    "Watchdog"      cmd_timeout_s, update_rate_hz
#    "Sicherheit"    dry_run, allow_rs485
#    "RS485"         Port, Motor-IDs, Invertierung
#    "Modbus"        Register + Drehzahlgrenzen
#    "Frames"        odom/base_link, publish_tf
# =====================================================================
base_hardware:
  ros__parameters:
    # --- Topics ---
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"
    state_topic: "/base_hardware/state_json"

    # --- Geometrie [NEU KALIBRIERT 12.08.2026 abends, siehe unten] ---
    # WIRKSAMER Rollradius unter Last, nicht der Katalogwert.
    #
    # ACHTUNG - der Odometriefehler besteht aus ZWEI Anteilen, und nur einer
    # davon gehoert in diese Datei:
    #
    #   echte Strecke = 16.6 mm  +  1.0150 * gemeldete Strecke
    #                   ^^^^^^^     ^^^^^^
    #                   je FAHRT    Skalenfehler -> hier korrigierbar
    #                   konstant
    #
    # Der feste Anteil von rund 17 mm faellt bei JEDER Fahrt einmal an,
    # unabhaengig von ihrer Laenge. Er ist KEIN Radiusfehler und laesst sich
    # durch keinen Wert in dieser Datei beheben. Wer es doch versucht, bekommt
    # eine Odometrie, die bei genau einer Streckenlaenge stimmt und bei allen
    # anderen daneben liegt - bei kurzen Fahrten stark, bei langen kaum.
    #
    # NACHWEIS (12.08.2026, Lasermessgeraet; Radius zum Messzeitpunkt in
    # Klammern, deshalb sind die Rohwerte nur ueber die Radumdrehung
    # vergleichbar):
    #   gemeldet 0.410 m -> gemessen 0.434 m   (0.0612)
    #   gemeldet 1.012 m -> gemessen 1.044 m   (0.0612)
    #   gemeldet 0.511 m -> gemessen 0.540 m   (0.0612)
    #   gemeldet 0.510 m -> gemessen 0.528 m   (0.0612)
    #   gemeldet 1.001 m -> gemessen 1.029 m   (0.0621)
    #   gemeldet 0.314 m -> gemessen 0.334 m   (0.0621)
    #   gemeldet 2.511 m -> gemessen 2.539 m   (0.0621)
    # Waere es ein reiner Radiusfehler, muesste die Abweichung proportional zur
    # Strecke wachsen. Tut sie nicht. Entscheidender Versuch: zweimal 0.50 m
    # getrennt gefahren ergab zusammen 1.068 m bei 1.021 m gemeldet, waehrend
    # dieselbe Strecke am Stueck nur 1.044 m bei 1.012 m ergab. Die zweite
    # Fahrt brachte einen zweiten Versatz mit. Vorhergesagt waren 1.072 m fuer
    # "Versatz je Fahrt" gegen 1.053 m fuer "Versatz nur einmal".
    #
    # Der interne Mechanismus des alten 0x000C-Drehzahlwerts bleibt offen.
    # 50-Hz-Polling widerlegte reine Unterabtastung; Freigabe der Welle und
    # rein kinetisches Rutschen wurden ebenfalls durch Messungen widerlegt.
    # Der neue Encoderpfad adressiert den Softwarefehler, ist aber erst nach der
    # H2-Countsbestimmung und der H4-A/B-Fahrt am realen Roboter bestaetigt.
    #
    # WARUM DIE MESSREIHE SO LANG WURDE: Fester Versatz und Skalenfaktor sind
    # stark korreliert, solange alle Fahrten aehnlich lang sind. Aus den ersten
    # vier Fahrten (0.41 bis 1.01 m) kamen je nach Auswertung Radien zwischen
    # 0.0621 und 0.0631 heraus - eine Vorhersage aus dieser Anpassung wurde
    # anschliessend widerlegt. Erst der Hebel aus einer KURZEN und einer LANGEN
    # Fahrt trennt beide Groessen: bei 0.30 m macht ein 16-mm-Versatz 5 % aus,
    # bei 2.50 m nur 0.6 %.
    #
    # Ausgleichsgerade ueber alle sieben Fahrten, in Radumdrehung gerechnet
    # (Hebel 5.1 bis 40.4 rad), groesste Restabweichung 8.0 mm:
    #   wirksamer Radius 0.06241 m, fester Versatz 16.0 mm je Fahrt
    # Gegenprobe allein aus dem 0.30/2.50-Hebel: 0.06233 m und 18.9 mm -
    # zwei unabhaengige Auswertungen, 0.13 % auseinander.
    #
    # Plausibel: 62.4 mm liegen unter dem Katalogwert 62.5 mm, wie es die
    # Abplattung des Reifens unter Last erwarten laesst. Die frueheren
    # Einpunktrechnungen ergaben bis zu 64.8 mm - groesser als der Katalogwert
    # und damit physikalisch unsinnig.
    wheel_radius_m: 0.0624      # [KALIBRIERT 12.08.2026 abends, vorher 0.0612]
    # ACHTUNG - haengt am Radradius: Der Drehwinkel wird als
    #   theta = Radradius * (Raddifferenz) / Spurweite
    # berechnet. Wird der Radius geaendert, MUSS die Spurweite im selben
    # Verhaeltnis mitgehen, sonst stimmt die Drehung nicht mehr.
    #
    # Kalibrierweg am 12.08.2026 (abends), zwei getrennte Messungen:
    #
    #   1. WINKEL, mit tools/kartierung/odometrie_winkel_messen.py: je eine
    #      volle Umdrehung in beide Richtungen bei 0.25 rad/s, der Winkel
    #      durchgehend gegen den LiDAR verfolgt statt nur Anfang gegen Ende.
    #      283 Messpunkte je Richtung, R2 = 0.997.
    #        gegen den Uhrzeigersinn 0.99628, im Uhrzeigersinn 0.99564
    #      Beide Richtungen stimmen auf 0.00064 ueberein - ein echter
    #      Skalenfehler, kein richtungsabhaengiger Effekt. -1.45 Grad je
    #      Umdrehung.
    #      WICHTIG: Eine Winkelmessung bestimmt nur das VERHAELTNIS r/W, nie
    #      die Spurweite allein. Genau deshalb blieb der Streckenfehler
    #      frueher unentdeckt: r und W waren beide zu klein, aber im fast
    #      gleichen Verhaeltnis - die Drehung stimmte, die Strecke nicht.
    #
    #   2. STRECKE, sieben Fahrten mit dem Lasermessgeraet (s.o.): wirksamer
    #      Radius 0.06241 m nach Abzug des festen Anfahrversatzes.
    #
    #   Daraus: W_neu = (0.06241 / 0.0612) * 0.3755 / 0.99596 = 0.3845
    #   (Der Winkelfaktor 0.99596 wurde mit Radius 0.0612 und Spurweite 0.3755
    #   gemessen; beide gehen deshalb in die Umrechnung ein.)
    #
    # Plausibilitaet: 384.5 mm liegen 6.5 mm ueber den abgemessenen 378 mm
    # Radmitte-zu-Radmitte. Der Aufstandspunkt eines breiten Reifens liegt
    # nicht exakt unter der Radmitte, und beim Drehen auf der Stelle radiert
    # der Reifen - beides vergroessert die WIRKSAME Spurweite gegenueber der
    # geometrischen. 1.7 Prozent Aufschlag sind dafuer erwartbar.
    #
    # Gegenprobe: r/W aendert sich von 0.16298 auf 0.16232, also um
    # -1.47 Grad je Umdrehung - der unabhaengig gemessene Winkelfehler betrug
    # -1.45 Grad. Die beiden Messwege sind damit in sich stimmig.
    wheel_separation_m: 0.3845  # [KALIBRIERT 12.08.2026 abends, vorher 0.3755]
    # Radumfang = 2*pi*0.0624 = 0.3921 m  (eine Radumdrehung = 39,21 cm Weg)

    # --- Getriebe [GEMESSEN: Schrittmotor-Getriebe 10:1] ---
    # Motorumdrehungen pro RAD-Umdrehung. Der Node rechnet Rad-Drehzahl in
    # MOTOR-Drehzahl um, bevor er sie per RS485 schickt. Ohne diesen Faktor
    # fuehre der Roboter 10x zu langsam.
    gear_ratio: 10.0

    # --- Limits fuer erste Tests [konservativ lassen] ---
    max_linear_speed_mps: 0.30      # -> Rad 45,8 rpm -> Motor 458 rpm
    max_angular_speed_radps: 0.80   # -> zusaetzlich +/- 231 rpm Motor je Rad

    # --- Watchdog / Update ---
    cmd_timeout_s: 0.25         # ohne neues /cmd_vel -> Stopp (Testpublish mit -r 10!)
    update_rate_hz: 50.0

    # --- Sicherheitsmodus ---
    dry_run: true               # true = rechnet nur, sendet KEINE Motorbefehle
    allow_rs485: false          # beide zusammen freischalten = echter Motorlauf

    # --- RS485 Bus B [PRUEFEN: echter Port via 'ls -l /dev/ttyUSB*'] ---
    rs485_port: "/dev/ttyUSB_BASE"
    baudrate: 115200
    left_motor_id: 1
    right_motor_id: 2
    invert_left: false
    invert_right: true          # 24.07.2026: ESS23-RS steuert Richtung via Vorzeichen
                                # in 0x001D (signed int16). Rechter Motor spiegelbildlich
                                # -> motor_direction_sign=-1 (Roboter-vorwaerts = negativ). herum

    # --- Modbus-Register (offizielle ESS-RS-Registertabelle, 24.07.2026 bestaetigt) ---
    rpm_register: 0x001D        # signed int16 Jog/Speed-Drehzahl (U/min); Vorzeichen = Richtung
    direction_register: 0x001C  # UNGENUTZT: ESS-RS hat kein Richtungsregister (Richtung via Vorzeichen 0x001D)
    command_register: 0x0027
    velocity_start_value: 0x0002
    stop_value: 0x0100

    # --- Anfahr- und Bremsrampe (28.07.2026 ergaenzt) ---
    # Diese Register wurden vorher NIE beschrieben: die Antriebe liefen mit ihrer
    # Werksrampe an, und der Roboter NICKTE beim Anfahren sichtbar. Das verfaelscht
    # die Karte, weil die Kamera auf 1.34 m sitzt - schon 2 Grad Nicken verschieben
    # den gemessenen Boden auf 3 m um rund 10 cm, dann wird Boden als Wand
    # eingetragen. Groessere Werte = sanfter. Einheit: Millisekunden.
    accel_register: 0x001E
    decel_register: 0x001F
    # Startdrehzahl: mit dieser Drehzahl setzt der Antrieb SOFORT ein, bevor die
    # Rampe greift. Stand auf 30 rpm (Rest aus dem Richtungstest vom 24.07.2026);
    # bei Fahrdrehzahlen um 46 rpm sprang der Motor damit auf 65 % der
    # Zielgeschwindigkeit - DAS war der Ruck beim Anfahren, nicht die Rampe.
    start_speed_register: 0x0020
    start_speed_rpm: 5          # [TUNE] kleiner = weicher los, zu klein = evtl. zaeh
    # ACHTUNG ZUR EINHEIT: Die Rampenzeit gilt fuer die MAXIMALDREHZAHL
    # (+/-3000 rpm), nicht fuer die angeforderte. Bei den kleinen Drehzahlen im
    # Fahrbetrieb bleibt davon nur ein Bruchteil uebrig:
    #   geradeaus 0.12 m/s -> ~187 rpm -> 2500 * 187/3000  = 156 ms
    #   drehen 0.40 rad/s  -> ~117 rpm -> 2500 * 117/3000  =  97 ms
    # Mit den vorherigen 800 ms waren es nur 50 bzw. 31 ms - praktisch ein
    # Sprung. Beim Drehen war das als Ruckeln spuerbar (12.08.2026), weil der
    # hohe Aufbau um die Hochachse weniger steif ist als in Fahrtrichtung.
    # Verstaerkt wird das dadurch, dass das Steuerkreuz digital ist: Druecken
    # heisst sofort voller Ausschlag, es gibt kein sanftes Andosieren.
    # ================== GEMESSEN 13.08.2026 - BITTE LESEN ==================
    # Der Antrieb LEHNT 2500 AB. Ein Schreibversuch beantwortet er mit
    # ExceptionResponse(function_code=134, exception_code=7), also negative
    # acknowledge. Abgetastet wurde die Grenze am realen Motorpaar:
    #   0x001E akzeptiert bis 2000, lehnt 2500 und 5000 ab
    #   0x001F akzeptiert bis 2000, lehnt 2500 und 5000 ab
    #
    # Die Anfahrrampe war damit NIE wirksam konfiguriert. Ausgelesen standen in
    # 0x001E auf beiden Motoren 100 - weder die frueher eingetragenen 800 noch
    # die 2500. 0x001F (400) und 0x0020 (5) dagegen stimmten mit dieser Datei
    # ueberein, Schreibzugriffe funktionieren also grundsaetzlich.
    #
    # Aufgefallen ist das erst, weil der Encoder-Branch die Rueckgabewerte der
    # Schreibvorgaenge PRUEFT. Der vorherige Code rief _write_register dreimal
    # ohne jede Auswertung auf und verschluckte den Fehlschlag. Das erklaert
    # rueckwirkend den Eintrag vom 28.07.2026, die Solldrehzahl sei "nach ~110 ms
    # zu 90 % erreicht, trotz 800-ms-Rampe" - die Rampe stand nie auf 800.
    #
    # WARUM HIER JETZT 100 STEHT: Das ist exakt der Wert, den die Hardware
    # ohnehin faehrt. Damit gelingt der Schreibvorgang, der Knoten startet, und
    # das Fahrverhalten aendert sich um kein Jota. Eine wirklich weichere Rampe
    # waere mit bis zu 2000 moeglich und entspraeche der urspruenglichen Absicht
    # von 2500 - das ist aber eine echte Verhaltensaenderung am Antrieb und
    # gehoert nach AGENTS.md 7 in einen eigenen, getrennt getesteten Schritt.
    # Zur Groessenordnung: Die Rampenzeit gilt fuer 3000 rpm. Bei den 153 rpm
    # einer 0.10-m/s-Fahrt sind 100 rund 5 ms, 2000 waeren rund 102 ms.
    # =======================================================================
    accel_ms: 100               # [GEMESSEN] Hardwaregrenze 2000; 2500 wird abgelehnt
    # Bremsen MUSS deutlich haerter sein als Beschleunigen. Mit 800 ms lief der
    # Roboter nach dem Loslassen des Sticks sichtbar nach - das ist gefaehrlich,
    # weil der Bremsweg dann laenger ist als der Sensorhorizont der VL53.
    # Bremsen MUSS deutlich haerter sein als Beschleunigen. Beim Loslassen soll
    # der Roboter stehen, nicht ausrollen - ein langer Bremsweg ist gefaehrlich,
    # weil er den Sensorhorizont uebersteigt, und beim Kartieren stoert er die
    # Positionsschaetzung.
    # Abgestimmte Werte aus der Praxis (Nutzerurteil am Geraet):
    #   250 ms zu ruppig, 800 und 1200 ms liefen sichtbar nach, 400 ms passt.
    # Beschleunigen darf davon unabhaengig lang sein - das ist kein Widerspruch,
    # sondern Absicht: sanft los, zuegig stehen.
    decel_ms: 400               # [TUNE] kleiner = schneller stehen

    rpm_scale: 1.0              # Registerwert je Motor-rpm (1.0 = direkt in rpm)
    # Obergrenze in MOTOR-rpm (nach Getriebe). 700 deckt die Limits oben ab
    # (Vollgas + Drehung = ca. 690). [PRUEFEN: Motor-Datenblatt!]
    max_motor_rpm: 700.0
    # 0.05 war zu knapp: eine Transaktion braucht real ~5 ms, aber waehrend des
    # Startgewitters (OAK + VL53 + RTAB-Map belegen gleichzeitig den USB-Bus)
    # lief sie in den Timeout und riss die Verbindung. 0.1 gibt Luft. Verdeckte
    # pymodbus-Wiederholungen sind deaktiviert; der Node zaehlt Fehler sichtbar
    # und baut die Verbindung kontrolliert wieder auf (_ensure_rs485).
    modbus_timeout_s: 0.1
    modbus_retries: 0       # kein verstecktes 3x-Blocking im Stop-/Fehlerpfad
    modbus_write_period_s: 0.05

    # --- Encoderpositions-Odometrie (13.08.2026 Softwarestand) ---
    # 0x000A/0x000B zaehlen absolute Motorposition; 0x000C bleibt reine
    # Diagnosetelemetrie. Im realen Betrieb gibt es niemals Sollwertfallback.
    # WICHTIG: Die Positionseinheit ist am echten Motor noch zu bestimmen.
    # Deshalb blockiert counts=0 den echten Encoderbetrieb fail-closed.
    odometry_source: "encoder_position"
    encoder_position_register: 0x000A
    encoder_segment_register: 0x0011
    encoder_word_order_register: 0x0019
    encoder_resolution_register: 0x0101
    # H2 GEMESSEN 13.08.2026 am realen Motorpaar, aufgebockt, Raeder frei.
    # Verfahren: Encoderstand strikt lesend vor und nach einem befristeten
    # Motorlauf erfasst (das Lesewerkzeug und base_hardware liefen NIE
    # gleichzeitig - zwei Modbus-Master sind verboten). Bodenreferenz war eine
    # Markierung am Rad, vom Nutzer in BEIDEN Richtungen mit genau 5
    # Radumdrehungen bestaetigt.
    #
    #   Lauf                 M1 Delta   M2 Delta   Counts/Motorumdrehung
    #   vorwaerts  65.3 s     +50040     -50045    1000.8 / 1000.9
    #   rueckwaerts 65.3 s    -50009     +50017    1000.2 / 1000.3
    #
    # Richtungsunterschied 0.062 % (M1) und 0.056 % (M2); Vorzeichen kehren sich
    # sauber um. Ein dritter Lauf ueber 65.0 s ergab konsistent +49804/-49810.
    # Gegenrechnung ueber die kommandierte Motordrehzahl (46 rpm) ergab 999.4
    # bis 999.5 - ein voellig anderer Weg, dasselbe Ergebnis.
    #
    # Alle vier Messwerte liegen innerhalb 0.1 % um 1000. Das deckt sich mit
    # 0x0011=1000, war aber NICHT von dort uebernommen - die Uebergabe verbietet
    # das ausdruecklich, und der Wert ist unabhaengig gemessen.
    encoder_counts_per_motor_revolution: 1000.0   # [H2 GEMESSEN 13.08.2026]
    # Beidseitig read-only bestaetigt und ueber alle Messlaeufe unveraendert
    # (Vorher-/Nachher-Vergleich): 0x0011=1000, 0x0019=0 (high/low), 0x0101=4000
    # auf Motor 1 UND Motor 2. Damit ist die Verriegelung scharf: Weicht ein
    # Antrieb spaeter davon ab, sperrt der Knoten den Encoderpfad.
    encoder_expected_segment: 1000
    encoder_expected_resolution: 4000
    encoder_feedback_period_s: 0.05           # 20 Hz; 50 Hz Buslast wurde bewiesen
    encoder_stale_timeout_s: 0.30
    encoder_max_recovery_gap_s: 2.0
    encoder_max_delta_factor: 1.5
    encoder_failure_stop_count: 5

    # Legacy-Drehzahlquelle bleibt fuer dokumentierten Rollback verfuegbar.
    # Sie integriert im realen Betrieb ebenfalls nie mehr den Sollwert.
    use_speed_feedback: true
    speed_register: 0x000C
    feedback_period_s: 0.1

    # --- Frames ---
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    # Projektentscheidung: spaeter soll ekf_node odom->base_link publizieren.
    # UEBERGANG (25.07.2026): Es gibt noch KEINEN EKF, aber seit die Odometrie
    # aus der GEMESSENEN Ist-Drehzahl (0x000C) kommt, ist der odom->base_link-TF
    # aussagekraeftig. base_hardware publiziert ihn daher selbst, damit die Nav2-
    # local_costmap (rolling window im odom-Frame) arbeiten kann.
    # ZURUECK AUF false setzen, sobald ekf_node/SLAM diesen TF uebernimmt,
    # sonst publizieren zwei Quellen denselben Transform (Konflikt).
    publish_tf: true
    # Konservative Startvarianzen, noch nicht hardwarekalibriert. In H4/H5
    # gegen wiederholte externe Messungen bestimmen; null waere "perfekt".
    odom_pose_xy_variance: 0.0025
    odom_yaw_variance: 0.0076
    odom_twist_linear_variance: 0.01
    odom_twist_angular_variance: 0.03
