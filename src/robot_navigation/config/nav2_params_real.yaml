# =====================================================================
#  nav2_params_real.yaml  -  Nav2 fuer REALE Hardware (VL53-Umfahrung)
# =====================================================================
#  Abgeleitet von nav2_params.yaml (virtueller Lauf). Unterschiede fuer die
#  echte Fahrt:
#    - obstacle_layer in local + global costmap, gespeist aus den beiden
#      VL53-Punktwolken -> Nav2 sieht reale Hindernisse und plant drumherum.
#    - use_collision_detection: true (Regler bremst vor Costmap-Hindernissen).
#    - konservativ abgestimmter Regler + echter velocity_smoother fuer die
#      traege 2000-ms-Anfahrtsrampe der Motoren.
#    - robot_radius: 0.40 (Sicherheitswert; Plattform 0.70x0.50 -> ~0.43
#      umschrieben). In nav2_params.yaml ist er bewusst 0.30 (Testwohnungs-
#      Tueren) - deshalb eine EIGENE Datei, damit der virtuelle Test unberuehrt
#      bleibt.
#  WICHTIG - Raeumen: Der obstacle_layer nutzt NICHT die sparsame Original-Wolke
#  (/near_field/*/points; die liefert bei freier Sicht 0 Punkte -> keine
#  Raeum-Strahlen -> Geister-Hindernisse), sondern die costmap-freundliche Wolke
#  /near_field/*/points_costmap: pro Spalte 1 horizontaler Punkt, freie
#  Richtungen auf 0.60 m (costmap_clear_range_m im vl53-Node). Damit:
#    obstacle_max_range 0.55  (echte Treffer <=0.50 markieren; 0.60-Clear-Punkte
#                              liegen darueber -> werden NICHT markiert)
#    raytrace_max_range 0.7   (>0.60 -> Clear-Punkte raeumen ihren Strahl)
#  Der collision_monitor bleibt auf der Original-Wolke (unveraendert verifiziert).
#  cmd_vel-Verkettung: Regler+Behavior -> cmd_vel_nav_raw -> fail-closed
#  mission_cmd_vel_gate -> cmd_vel_nav -> velocity_smoother
#  -> cmd_vel_smoothed -> collision_monitor -> /cmd_vel -> base_hardware.
#  Der Sicherheitsstopp bleibt hinter dem Komfort-Smoother und wird daher
#  nicht verzoegert.
# =====================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # Humble verwirft bei Ablauf den noch ausstehenden Unterziel-Handle. Unter
    # Jetson-Last kam die FollowPath-Annahme real erst nach ~590 ms; 20 ms
    # erzeugten dadurch ein verwaistes, weiterfahrendes Controller-Ziel.
    default_server_timeout: 2000

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Die bestaetigte 2000-ms-Hardware-Rampe bewegt Amadeus beim sanften
      # Start in 15 s nur etwa 0,19 m. Die fruehere 0,30-m-Schwelle brach
      # deshalb eine freie, gerade Fahrt faelschlich als festgefahren ab.
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.40
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10        # REAL: konservativ fuer 2000-ms-Motorrampe
      lookahead_dist: 0.8
      min_lookahead_dist: 0.6
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.2
      max_angular_accel: 0.3
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.04
      use_collision_detection: true    # REAL: Sensorik vorhanden -> Regler-Kollisionscheck an
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 6x6 m statt 4x4: das Fenster faehrt mit dem Roboter mit und reichte
      # bisher nur 2 m nach vorn - die OAK sieht aber 4 m. Mit 6x6 (3 m nach
      # vorn) kommt die Fernsicht auch in der LOKALEN Reaktion an, nicht nur
      # in der globalen Route. Kostet CPU (120x120 statt 80x80 Zellen).
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.40             # REAL: Sicherheitswert (Plattform ~0.43 umschrieben)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: vl53_left vl53_right oak
        vl53_left:
          topic: /near_field/left/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55      # VL53 liefert nur Punkte <= 0.50 m
          raytrace_max_range: 0.7
        vl53_right:
          topic: /near_field/right/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
        # OAK-Tiefenkamera: die FERNSICHT (mehrere Meter), die den VL53 fehlt.
        # Hoehen sind im Costmap-Frame (z=0 = base_link = 9 cm ueber Boden):
        #   min -0.04 = 5 cm ueber Boden -> Boden bleibt draussen (er liegt bei
        #   -0.09; gemessen sind nur ~5 % der Punkte Bodenpunkte).
        #   max 1.50 = bis Roboterhoehe.
        oak:
          topic: /oak/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -0.04
          max_obstacle_height: 1.50
          obstacle_max_range: 4.0     # so weit voraus wird markiert
          raytrace_max_range: 5.0     # etwas weiter -> raeumt sauber frei
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.40
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: vl53_left vl53_right oak
        vl53_left:
          topic: /near_field/left/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
        vl53_right:
          topic: /near_field/right/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
        # OAK-Tiefenkamera: die FERNSICHT (mehrere Meter), die den VL53 fehlt.
        # Hoehen sind im Costmap-Frame (z=0 = base_link = 9 cm ueber Boden):
        #   min -0.04 = 5 cm ueber Boden -> Boden bleibt draussen (er liegt bei
        #   -0.09; gemessen sind nur ~5 % der Punkte Bodenpunkte).
        #   max 1.50 = bis Roboterhoehe.
        oak:
          topic: /oak/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -0.04
          max_obstacle_height: 1.50
          obstacle_max_range: 4.0     # so weit voraus wird markiert
          raytrace_max_range: 5.0     # etwas weiter -> raeumt sauber frei
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    # OPEN_LOOP ist hier absichtlich: CLOSED_LOOP plus der zusaetzlichen
    # 2000-ms-Motorrampe bildete im Realtest eine doppelte Rueckkopplung und
    # liess nach 3 s nur etwa 0.007 m/s durch. Die Encoder bleiben unveraendert
    # die Odometriequelle fuer Nav2 und alle Sicherheitspruefungen.
    feedback: "OPEN_LOOP"
    max_velocity: [0.12, 0.0, 0.25]
    min_velocity: [0.0, 0.0, -0.25]
    max_accel: [0.12, 0.0, 0.30]
    max_decel: [-0.30, 0.0, -0.60]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

map_server:
  ros__parameters:
    yaml_filename: ""                # wird von der Launch-Datei gesetzt (absolut)
