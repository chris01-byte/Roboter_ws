# =====================================================================
#  nav2_params_real.yaml  -  Nav2 fuer REALE Hardware (VL53-Umfahrung)
# =====================================================================
#  Abgeleitet von nav2_params.yaml (virtueller Lauf). Unterschiede fuer die
#  echte Fahrt:
#    - obstacle_layer in local + global costmap, gespeist aus den beiden
#      VL53-Punktwolken -> Nav2 sieht reale Hindernisse und plant drumherum.
#    - use_collision_detection: true (Regler bremst vor Costmap-Hindernissen).
#    - desired_linear_vel: 0.12 (bewusst langsam fuer die erste autonome Fahrt).
#    - robot_radius: 0.40 (Sicherheitswert; Plattform 0.70x0.50 -> ~0.43
#      umschrieben). In nav2_params.yaml ist er bewusst 0.30 (Testwohnungs-
#      Tueren) - deshalb eine EIGENE Datei, damit der virtuelle Test unberuehrt
#      bleibt.
#  WICHTIG - Raeumen: Der obstacle_layer nutzt NICHT die sparsame Original-Wolke
#  (/near_field/*/points; die liefert bei freier Sicht 0 Punkte -> keine
#  Raeum-Strahlen -> Geister-Hindernisse), sondern die costmap-freundliche Wolke
#  /near_field/*/points_costmap: pro Spalte 1 horizontaler Punkt, freie
#  Richtungen auf 0.60 m (costmap_clear_range_m im vl53-Node). Damit:
#    obstacle_max_range 0.55  (echte Treffer <=0.50 markieren; 0.60-Clear-Punkte
#                              liegen darueber -> werden NICHT markiert)
#    raytrace_max_range 0.7   (>0.60 -> Clear-Punkte raeumen ihren Strahl)
#  Der collision_monitor bleibt auf der Original-Wolke (unveraendert verifiziert).
#  cmd_vel-Verkettung: Regler+Behavior publizieren (per Launch-Remap) auf
#  cmd_vel_smoothed -> collision_monitor -> /cmd_vel -> base_hardware.
# =====================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.40
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.12        # REAL: langsam fuer erste autonome Fahrt
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 2.0
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.1
      use_collision_detection: true    # REAL: Sensorik vorhanden -> Regler-Kollisionscheck an
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.40             # REAL: Sicherheitswert (Plattform ~0.43 umschrieben)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: vl53_left vl53_right
        vl53_left:
          topic: /near_field/left/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55      # VL53 liefert nur Punkte <= 0.50 m
          raytrace_max_range: 0.7
        vl53_right:
          topic: /near_field/right/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.40
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: vl53_left vl53_right
        vl53_left:
          topic: /near_field/left/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
        vl53_right:
          topic: /near_field/right/points_costmap
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          obstacle_max_range: 0.55
          raytrace_max_range: 0.7
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

map_server:
  ros__parameters:
    yaml_filename: ""                # wird von der Launch-Datei gesetzt (absolut)
