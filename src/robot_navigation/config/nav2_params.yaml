# =====================================================================
#  nav2_params.yaml  -  Nav2 fuer den mobilen Roboter (ROS 2 Humble)
# =====================================================================
#  Ausgelegt fuer den VIRTUELLEN Lauf ohne Hardware (Testkarte + Dry-Run-
#  Basis: perfekte Odometrie, keine Sensorik) UND als Basis fuer spaeter:
#  - Lokalisierung: map->odom kommt als statische Identitaet aus der Launch
#    (Dry-Run-Odometrie ist fehlerfrei). Mit SLAM/AMCL ersetzt deren TF
#    diese Zeile - die Parameter hier bleiben gueltig.
#  - Sensorik: Costmaps haben noch KEINE Beobachtungsquellen; sobald die
#    VL53-Wolken/Kamera real sind, obstacle_layer ergaenzen (Vorlage:
#    vl53_near_field/config/costmap_vl53_obstacle_layer.snippet.yaml).
#
#  SCHNELL FINDEN (nach Abschnittsnamen suchen, keine Zeilennummern):
#    "bt_navigator"     Frames/Odom-Topic
#    "controller"       Regler (RPP), Zieltoleranzen, Tempo [TUNE]
#    "costmap"          Radius/Inflation [TUNE], Layer
#    "planner"          NavFn
#    "behavior"         Recovery (Spin/BackUp/Wait)
# =====================================================================

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # BT-XML + Plugin-Liste: Humble-Defaults (im bt_navigator einkompiliert)

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15        # [TUNE] Zieltoleranz Position [m]
      yaw_goal_tolerance: 0.40       # [TUNE] Zieltoleranz Drehung [rad]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22       # [TUNE] < max_linear_speed_mps der Basis (0.3)
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 2.0
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.1
      use_collision_detection: false   # keine Sensorik im virtuellen Lauf
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.30             # [TUNE] BEWUSST klein fuer die Testwohnung-Tueren;
                                     # real ist die halbe Plattformdiagonale ~0.43 - vor
                                     # Hardware-Fahrten pruefen/anheben (auch global_costmap)!
      plugins: ["inflation_layer"]   # Sensor-Layer folgen mit echter Hardware
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45       # [TUNE]
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

map_server:
  ros__parameters:
    yaml_filename: ""                # wird von der Launch-Datei gesetzt (absolut)
