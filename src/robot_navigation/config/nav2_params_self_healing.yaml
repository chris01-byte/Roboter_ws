# =====================================================================
#  Nav2-Overlay fuer den selbstheilenden Erkundungsbetrieb (15.10.2026)
#  Wird NACH nav2_params_real.yaml geladen und ueberschreibt nur die
#  folgenden Werte. Aktiv nur mit nav_mapping.launch.py self_healing:=true.
#  Konzept: docs/wohnungserkundung/KONZEPT_SELBSTHEILUNG.md
# =====================================================================

planner_server:
  ros__parameters:
    GridBased:
      # Unbekannte Zellen sind Vorsicht, kein Verbot: NavFn darf durch
      # Unbekanntes planen. Gemessene Hindernisse (LiDAR, VL53, OAK) bleiben
      # in beiden Kostenkarten verbindlich; RPP prueft die volle Kontur gegen
      # die lokale Kostenkarte, der collision_monitor stoppt vor /cmd_vel.
      allow_unknown: true

# Fahrtempo (Entscheidung Projektinhaber 05.11.2026 nach SH-6): vorwaerts
# +35 %, Drehen +25 % gegenueber dem Realprofil. Grund: alle drei SH-6-Fahrten
# endeten am Zeitbudget, das Tempo war zu langsam. Nur im Selbstheilungsbetrieb.
# Unveraendert: Kollisionsmonitor (Approach 2 s, SlowZone 30 %), Motorrampen
# (Bremsen 400 ms), base_hardware-Grenzen (0,30 m/s, 0,80 rad/s), Rueckfahrt
# 0,05 m/s. Rueckfall: diesen Block und die Tempowerte im Glaetter entfernen
# (wieder 0,10 m/s / 0,20 rad/s, Grenzen 0,12 / 0,25).
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.135          # Realprofil 0.10 (+35 %)
      rotate_to_heading_angular_vel: 0.25   # Realprofil 0.20 (+25 %)

velocity_smoother:
  ros__parameters:
    # Begrenzte Rueckwaertsfahrt fuer die Rueckfahrt entlang der eigenen Spur
    # (BackUp des Behavior-Servers, vom Explorer nur auf geradem, selbst
    # befahrenem Spurabschnitt ausgeloest, max. 0,4 m). RPP bleibt
    # allow_reversing: false. Obergrenzen vorwaerts/drehend mit dem Tempo oben
    # um 35 % / 25 % angehoben (Realprofil 0.12 / 0.25).
    max_velocity: [0.162, 0.0, 0.3125]
    min_velocity: [-0.05, 0.0, -0.3125]

behavior_server:
  ros__parameters:
    # BackUp prueft die Kontur gegen die lokale Kostenkarte ueber diese Zeit.
    simulate_ahead_time: 2.0
    # Rueckfahrkontur statt voller gepolsterter Kontur (Entscheidung
    # Projektinhaber 08.11.2026 nach SH-7N): BackUp prueft zuerst die aktuelle
    # Pose; lag die volle Kontur schon an einer belegten Zelle an (Garderobe,
    # Ecke), brach die Rueckfahrt nach 1 ms ab, obwohl hinten frei war. Die
    # Rueckfahrkontur deckt das Heck mit Polster und die Breite (1 cm unter der
    # halben Breite) ab, also genau die Flaeche, in die eine gerade
    # Rueckwaertsfahrt hineinfaehrt (Knoten robot_navigation/rueckfahr_kontur).
    # Humble-Name; Jazzy heisst er local_footprint_topic.
    # Rueckfall: Zeile entfernen (wieder local_costmap/published_footprint).
    footprint_topic: rueckfahr_kontur

# VL53 als Ausweichsensor (Entscheidung Projektinhaber 16.10.2026): jeder
# gueltige VL53-Treffer markiert. Die Wolke liegt geometrisch nie unter
# 0,084 m ueber Boden (0,50 m Reichweite, unterste Zeile -26,25 Grad, Sensor
# 0,305 m); -0,02 m ueber base_link = 0,07 m ueber Boden. Gemessen SH-1 v3:
# leerer Boden 0 Treffer, 5,5-10 cm hohe Objekte bisher vollstaendig
# verworfen. Nur die markierenden *_mark-Quellen; Raeumquellen unveraendert.
#
# Seitenwaende und niedrige Hindernisse im Nahbereich (Entscheidung
# Projektinhaber 22.10.2026, Kandidat X9 der Robustheitssimulation):
# - Beim Kartieren ist die OAK aus; die lokale Karte kannte nur, was die VL53
#   nach vorn sehen (+-30 Grad, 0,5 m). Der normierte LiDAR-Scan markiert
#   deshalb zusaetzlich in der lokalen Karte.
# - Ein 10-cm-Hindernis liegt naeher als ~0,37-0,42 m unter allen VL53-Zeilen;
#   2D-Raeumen ueber es hinweg loeschte seine Markierung. Die VL53-Raeumquellen
#   wirken deshalb erst ab 0,45 m vom Sensor.
#
# Eigene LiDAR-Ebene mit Raeumen (Entscheidung Projektinhaber 08.11.2026 nach
# SH-7N): Bis dahin markierte der LiDAR in der VL53-Ebene, raeumte aber nie.
# Real driftet die Odometrie je Fahrt 0,2-0,4 m und 2-6 Grad gegen die
# SLAM-Karte (in der Simulation ideal, deshalb dort unsichtbar); alte
# Wandeintraege blieben verschoben liegen (SH-7N: 113 bzw. 178 toedliche
# Zellen auf SLAM-freien Flaechen, meist 0,24-0,28 m neben den Waenden). Der
# LiDAR hat jetzt eine eigene Ebene und raeumt dort, was er durchsieht. Seine
# Strahlen beruehren die VL53-Ebene nicht; niedrige VL53-Markierungen bleiben
# wie nach X9 erhalten. Ohne /scan_normiert (normalize_scan:=false) kommt vom
# LiDAR nichts an; dann gilt das bisherige Verhalten. Rueckfall: plugins-Zeile
# und lidar_layer entfernen und lidar wieder als Quelle der obstacle_layer
# (Stand 7685a70), oder self_healing:=false.
#
# KM-1 B: nichts unter der Kontur loeschen (Entscheidung Projektinhaber
# 10.11.2026 fuer den Fall, dass die Stellprobe SH-8 nicht besteht; das trat am
# 13.11.2026 an den Muelleimern ein). Bisher loeschten beide Hindernisebenen
# alles unter der gepolsterten Kontur. Ein Hindernis im 2-cm-Polsterband
# verschwand dadurch aus der lokalen Karte; der Regler fuhr oder drehte weiter
# hinein, bis VL53-Punkte innerhalb der Kontur lagen. Dann setzt der
# Kollisionsmonitor (approach) jede Bewegung auf null, auch rueckwaerts
# (SH-8 s3a: beide Rueckfahrten ohne einen Fahrbefehl an der Basis). Jetzt
# bleibt das Hindernis eingetragen, der Regler haelt vorher an, weg geht es
# ueber die Rueckfahrkontur (AW-1). Simulation 09.11.2026: 3 von 5 bestanden
# (Produkt 0 von 7), nie "approach". Voraussetzung: kein Sensor erfasst den
# Roboter selbst, sonst bliebe das Eigenecho als Hindernis stehen (Pruefung
# im Stand: selbstheilung_stillstand_pruefen.py --eigenecho-s). Der
# Kollisionsmonitor und die globale Karte bleiben unveraendert.
# Rueckfall: beide footprint_clearing_enabled-Zeilen entfernen.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "lidar_layer", "inflation_layer"]
      obstacle_layer:
        footprint_clearing_enabled: False
        vl53_left:
          raytrace_min_range: 0.45
        vl53_right:
          raytrace_min_range: 0.45
        vl53_left_mark:
          min_obstacle_height: -0.02
        vl53_right_mark:
          min_obstacle_height: -0.02
      lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: False
        observation_sources: lidar
        lidar:
          topic: /scan_normiert
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0

# Wege mit mehr Abstand (Entscheidung Projektinhaber 08.11.2026 nach SH-7N):
# Die Kosten neben Hindernissen fallen flacher ab und reichen weiter (Basis
# 0,45 m / 3,0). Der Planer legt Wege so eher mittig durch Tueren und Flure
# statt dicht an Moebeln entlang. Unpassierbar wird dadurch nichts: Die
# Grenze bleibt der Roboterradius 0,28 m. Rueckfall: inflation_layer-Block
# entfernen.
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        vl53_left:
          raytrace_min_range: 0.45
        vl53_right:
          raytrace_min_range: 0.45
        vl53_left_mark:
          min_obstacle_height: -0.02
        vl53_right_mark:
          min_obstacle_height: -0.02
      inflation_layer:
        inflation_radius: 0.60
        cost_scaling_factor: 2.5
