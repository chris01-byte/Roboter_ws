# =====================================================================
#  slam_toolbox fuer Amadeus - 2D-Karte aus dem STL-27L
#  ====================================================================
#  Projektspezifisch, KEIN generischer Standardlauf. Die Frames sind die
#  vorhandenen Amadeus-Frames; der Herstellertreiber bleibt unberuehrt.
#
#  WICHTIG - NICHT GLEICHZEITIG MIT RTAB-MAP BETREIBEN:
#  Beide wuerden map->odom publizieren. Zwei Publisher fuer denselben
#  Transform ergeben einen springenden Roboter und unbrauchbare Karten.
#  Der Integrationsplan verlangt ohnehin zuerst eine reine LiDAR-Baseline,
#  bevor ueber eine Fusion mit der Kamera nachgedacht wird.
# =====================================================================
slam_toolbox:
  ros__parameters:
    # ---- Solver ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- Amadeus-Frames ----
    # odom -> base_link kommt von base_hardware (gemessene Raddrehzahl).
    # base_link -> laser_frame ist die vermessene Montagepose.
    # map -> odom erzeugt slam_toolbox selbst.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02      # 50 Hz map->odom
    map_update_interval: 1.0            # s zwischen Kartenaktualisierungen
    resolution: 0.05                    # m je Zelle, wie bei der RTAB-Map-Karte

    # Der STL-27L kann 25 m. Im Testraum (3,8 x 4,9 m) waeren das fast nur
    # Reflexionen ueber Tuerkanten hinweg; 10 m deckt auch angrenzende Raeume ab
    # und haelt die Rechenlast klein.
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ---- Wann ein neuer Kartenknoten entsteht ----
    # Klein genug fuer einen kleinen Raum, gross genug damit Stillstand die
    # Karte nicht flutet.
    minimum_travel_distance: 0.2        # m
    minimum_travel_heading: 0.2         # rad

    # ---- Scan-Abgleich ----
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ---- Schleifenschluss ----
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- Korrelation ----
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- Bewegungsrauschen ----
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
