# =====================================================================
#  STL-27L an Amadeus - Sensorparameter
#  ====================================================================
#  Der Herstellertreiber ldlidar_stl_ros2 bleibt unveraendert; alle
#  roboterspezifischen Werte stehen hier.
# =====================================================================
amadeus_stl27l:
  ros__parameters:
    product_name: LDLiDAR_STL27L
    topic_name: scan
    frame_id: laser_frame

    # Stabiler udev-Alias, siehe config/udev/99-amadeus-stl27l.rules.example.
    # NICHT /dev/ttyUSB0 - dort haengt der FTDI-Adapter des Motor-RS485-Busses.
    # Die Nummerierung ttyUSB0/1 haengt an der Einsteckreihenfolge; ein
    # vertauschter Port wuerde den Treiber auf die Motoren sprechen lassen.
    port_name: /dev/amadeus_lidar
    port_baudrate: 921600

    # ROS LaserScan verlangt: positiver angle_increment = gegen den
    # Uhrzeigersinn. Der Herstellertreiber spiegelt die nativen, im
    # Uhrzeigersinn laufenden STL-27L-Bins nur bei true. Mit false sah
    # slam_toolbox eine real gemessene -96,9-Grad-Drehung als etwa +97 Grad;
    # map->odom sprang dadurch um rund 167 Grad. Das wurde am 16.08.2026 mit
    # Encoder-Odometrie und map->base_link gleichzeitig gemessen.
    #
    # Diese Haendigkeitskorrektur ist mathematisch mit tf_yaw=+90 Grad
    # gekoppelt: Das zuvor bei +89 Grad gemessene Frontobjekt erscheint nach
    # der Spiegelung bei -89 Grad und liegt durch +90 Grad weiter bei 0 Grad
    # in base_link. Die Mastmaske bleibt entsprechend hinten bei 180 Grad.
    laser_scan_dir: true

    # ---- Winkelmaskierung des vom Mast verdeckten Sektors ----
    # GEMESSEN am 11.08.2026 mit tools/kartierung/lidar_totzone_messen.py
    # (40 Scans, stehender Roboter): Der Mast erzeugt zwischen 240 und 300 Grad
    # konstante Reflexionen in 8-10 cm Abstand - nah UND unbeweglich (Streuung
    # unter 2 mm ueber alle Scans, also kein Moebel und kein Mensch).
    # Vom Nutzer bestaetigt: Das ist der Kameramast; die Fahrtrichtung liegt bei
    # 0 Grad, also 90 Grad davon entfernt.
    # Mit 4 Grad Sicherheitszugabe je Rand gegen Mehrfachreflexionen an den
    # Gehaeusekanten:
    angle_crop_min: 236.0
    angle_crop_max: 304.0
    # -> 68 Grad verdeckt, 292 Grad nutzbares Sichtfeld.
    #
    # ACHTUNG zur Semantik: NACHGEMESSEN 12.08.2026 - dieser Treiberstand setzt
    # den Crop-Bereich auf NaN, nicht auf 0 wie hier frueher behauptet. Von 410
    # Strahlen im Sektor waren 409 NaN. Das ist die sicherere Variante: NaN ist
    # eindeutig ungueltig, waehrend eine 0 von einem nachlaessigen Verbraucher
    # als Messung gelesen werden koennte. Wer auf "== 0.0" prueft, findet die
    # Maskierung allerdings NICHT - genau das ist hier einmal passiert.
    # Unveraendert gilt: Der maskierte Sektor darf NIEMALS als freie Flaeche
    # interpretiert werden - er ist UNBEKANNTER Raum. Der Roboter hat dort
    # keinerlei Wahrnehmung.
    #
    # ZUR STRAHLENZAHL: Der Treiber liefert je Umdrehung unterschiedlich viele
    # Strahlen (gemessen 2145..2176, 19 verschiedene Werte). Karto verwirft
    # jeden Scan, dessen Zahl von der des ersten abweicht. Deshalb laeuft
    # scan_vereinheitlichen dazwischen; siehe docs/SLAM_TOOLBOX_ROTATION_FIX.md.

# =====================================================================
#  Montagepose base_link -> laser_frame   GEMESSEN 11.08.2026
#  --------------------------------------------------------------------
#  Nach ROS REP-103: x vorwaerts, y links, z oben; Winkel in Radiant.
#  base_link liegt bei Amadeus auf der Antriebsrad-Achse, mittig, 0,09 m
#  ueber dem Boden.
#
#    x      0.245 m   Radmitte->Vorderkante 275 mm (gemessen) minus 30 mm
#                     Vorderkante->LiDAR-Mitte
#    y      0.000 m   sitzt mittig, kein Versatz
#    z      0.660 m   750 mm Sichtscheibenmitte ueber Boden minus 90 mm
#    roll   0.0 rad   waagerecht montiert
#    pitch  0.0 rad
#    yaw   +1.5708 rad (+90 Grad)
#
#  ZUM YAW - der wichtigste Wert, und der einzige nicht direkt gemessene:
#  Ein Rohr genau vor dem Roboter erschien mit der alten, im Uhrzeigersinn
#  indizierten Ausgabe bei +89 Grad. Nach der oben notwendigen Spiegelung auf
#  ROS-Gegenuhrzeigersinn erscheint dasselbe Rohr bei -89 Grad. yaw=+90 Grad
#  dreht laser_frame daher passend zu base_link. Der native Mastsektor
#  236..304 Grad wird nach der Spiegelung zu 56..124 Grad und liegt mit diesem
#  TF weiterhin um 180 Grad in base_link = hinter dem Roboter.
#  Waere stattdessen yaw=0 uebernommen worden, laege jede Messung um 90 Grad
#  verdreht in der Karte.
#
#  ACHTUNG - Plattformlaenge: Die URDF fuehrt base_length 0.70 m (dort als
#  [ANPASSEN] markiert). Gemessen wurden 275 mm von der Radmitte zur
#  Vorderkante, also rund 0.55 m Gesamtlaenge. Die URDF und der davon
#  abgeleitete Nav2-Footprint sind entsprechend zu pruefen.
#
#  Eintragen als Argumente von stl27l.launch.py (tf_x ... tf_yaw) mit
#  publish_static_tf:=true - besser noch als fester Link in der URDF, dann
#  bleibt publish_static_tf aus (nie zwei Publisher fuer denselben Transform).
# =====================================================================
