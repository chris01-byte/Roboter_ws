# Ohne diese Umleitung landen console_scripts in install/<paket>/bin und
# "ros2 run" beziehungsweise launch finden sie nicht - der Launch bricht dann
# mit "libexec directory ... does not exist" ab. Gleiche Einstellung wie in
# src/base_hardware/setup.cfg.
[develop]
script_dir=$base/lib/amadeus_lidar_bringup
[install]
install_scripts=$base/lib/amadeus_lidar_bringup
